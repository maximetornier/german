PRÄSENS (present)

Used for: things happening now, general truths ("Die Sonne scheint."), and very often for the future when a time word makes it clear: "Ich fliege morgen nach Berlin." German uses the present tense for the future far more than English does.

Practical priority for B1: master Präsens and Perfekt first (they cover most real conversation), then Präteritum for sein/haben/modals and reading, then Futur I and Konjunktiv II. Konjunktiv I mostly matters for reading news and formal texts.`,

      </div>

      <div style={{ display: "flex", padding: "0 14px 8px", gap: 8 }}>

        {CATEGORIES.map(c => (
          <CategoryChip key={c} label={c} sub={CATEGORY_LABELS_EN[c]} active={cat === c} onClick={() => setCat(c)} />

            </div>
          )}
        </div>
      ) : (
        <Flashcards words={filtered} direction={direction} known={known} toggleKnown={toggleKnown} />
      )}
    </div>
  );
}

function Flashcards({ words, direction, known, toggleKnown }) {
  const [deck, setDeck] = useState([]);
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);

  useEffect(() => {
    const shuffled = [...words].sort(() => Math.random() - 0.5);
    setDeck(shuffled);
    setIdx(0);
    setFlipped(false);
  }, [words]);

  if (deck.length === 0) {
    return <div style={{ textAlign: "center", color: "#9A9DA3", padding: 50, fontSize: 14 }}>Keine Karten in dieser Auswahl.</div>;
  }
  if (idx >= deck.length) {
    return (
      <div style={{ textAlign: "center", padding: 50 }}>
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 10 }}>Runde fertig! 🎉</div>
        <div style={{ fontSize: 13.5, color: "#6B6F76", marginBottom: 16 }}>Du hast {deck.length} Karten geübt.</div>
        <button onClick={() => { setDeck([...words].sort(() => Math.random() - 0.5)); setIdx(0); setFlipped(false); }}
          style={{ border: "none", background: "#17181A", color: "#fff", padding: "10px 20px", borderRadius: 10, fontWeight: 700, fontSize: 13.5, display: "inline-flex", alignItems: "center", gap: 6 }}>
          <Shuffle size={15} /> Nochmal mischen
        </button>
      </div>
    );
  }

  const card = deck[idx];
  const front = direction === "de-en" ? card.de : card.en;
  const back = direction === "de-en" ? card.en : card.de;

  const next = (markKnown) => {
    if (markKnown !== undefined) {
      if (markKnown && !known.has(card.id)) toggleKnown(card.id);
      if (!markKnown && known.has(card.id)) toggleKnown(card.id);
    }
    setFlipped(false);
    setIdx(i => i + 1);
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", padding: "4px 20px 14px", overflowY: "auto" }}>
      <div style={{ fontSize: 11, color: "#9A9DA3", marginBottom: 6 }}>{idx + 1} / {deck.length}</div>
      <div onClick={() => setFlipped(f => !f)} style={{
        width: "100%", maxWidth: 280, minHeight: 120, background: "#fff", borderRadius: 14,
        border: "1.5px solid #EEEDE8", boxShadow: "0 4px 14px rgba(20,20,20,0.06)",
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        padding: 16, cursor: "pointer", textAlign: "center", gap: 6,
      }}>
        <div style={{ fontSize: 9.5, letterSpacing: 1.3, textTransform: "uppercase", color: "#E30613", fontWeight: 700 }}>
          {card.cat}
        </div>
        <div style={{ fontSize: 19, fontWeight: 800, color: "#17181A" }}>{front}</div>
        {flipped ? (
          <div style={{ fontSize: 14.5, color: "#4B4D52", marginTop: 2 }}>{back}</div>
        ) : (
          <div style={{ fontSize: 11, color: "#B7B9BC", marginTop: 2 }}>Zum Umdrehen tippen</div>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12, width: "100%", maxWidth: 280 }}>
        <button onClick={() => next(false)} style={{
          flex: 1, padding: "10px 0", borderRadius: 10, border: "1.5px solid #E8B4B4", background: "#FDF1F1",
          color: "#C22", fontWeight: 700, fontSize: 12.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
        }}><RotateCcw size={13} /> Nochmal</button>
        <button onClick={() => next(true)} style={{
          flex: 1, padding: "10px 0", borderRadius: 10, border: "none", background: "#2F7D4F",
          color: "#fff", fontWeight: 700, fontSize: 12.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
        }}><Check size={13} /> Weiß ich</button>
      </div>
    </div>
  );
}

            <div key={p} style={{
              display: "flex", justifyContent: "space-between", padding: "7px 14px",
              borderBottom: i < PERSONS.length - 1 ? "1px solid #F2F1EC" : "none",
            }}>
              <span style={{ fontSize: 12.5, color: "#6B6F76", fontWeight: 600 }}>{p}</span>
              <span style={{ fontSize: 13.5, fontWeight: 700, color: "#17181A" }}>{verb.forms[tense][i]}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   TEXTS TAB
   ========================================================================= */
function TextsTab() {
  const [selected, setSelected] = useState(null);
  const [showAll, setShowAll] = useState(false);
  const [revealed, setRevealed] = useState({});

  if (!selected) {
    return (
      <div style={{ padding: "12px 14px 90px", overflowY: "auto", height: "100%" }}>
        {TEXTS.map((t, i) => (
          <button key={i} onClick={() => { setSelected(i); setRevealed({}); setShowAll(false); }} style={{
            width: "100%", textAlign: "left", background: "#fff", border: "1px solid #EEEDE8", borderRadius: 10,
            padding: "10px 14px", marginBottom: 5, display: "flex", justifyContent: "space-between", alignItems: "center",
          }}>
            <div>
              <div style={{ fontSize: 14.5, fontWeight: 700, color: "#17181A" }}>{t.title}</div>
              <div style={{ fontSize: 11.5, color: "#9A9DA3", marginTop: 1 }}>{t.lines.length} Sätze</div>
            </div>
            <span style={{
              fontSize: 10.5, fontWeight: 800, color: "#E30613", border: "1.5px solid #E30613",
              borderRadius: 6, padding: "2px 7px",
            }}>{t.level}</span>
          </button>
        ))}
      </div>
    );
  }

  const text = TEXTS[selected];
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{ padding: "10px 16px 6px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={() => setSelected(null)} style={{ border: "none", background: "none", color: "#E30613", fontWeight: 700, fontSize: 13.5 }}>← Zurück</button>
        <button onClick={() => setShowAll(s => !s)} style={{
          border: "1.5px solid #DCDAD2", background: showAll ? "#17181A" : "#fff", color: showAll ? "#fff" : "#4B4D52",
          borderRadius: 8, padding: "5px 10px", fontSize: 12, fontWeight: 700,
        }}>{showAll ? "Übersetzung ausblenden" : "Alles übersetzen"}</button>
      </div>
      <div style={{ padding: "4px 16px 10px" }}>
        <div style={{ fontSize: 18, fontWeight: 800 }}>{text.title}</div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "0 16px 90px" }}>
        {text.lines.map(([de, en], i) => (
          <div key={i} onClick={() => setRevealed(r => ({ ...r, [i]: !r[i] }))} style={{
            background: "#fff", border: "1px solid #EEEDE8", borderRadius: 9, padding: "8px 13px",
            marginBottom: 4, cursor: "pointer",
          }}>
            <div style={{ fontSize: 14, color: "#17181A", lineHeight: 1.4 }}>{de}</div>
            {(showAll || revealed[i]) && (
              <div style={{ fontSize: 12.5, color: "#E30613", marginTop: 4, lineHeight: 1.35 }}>{en}</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================================
   GRAMMAR TAB
   ========================================================================= */
function GrammarTab() {
  const [open, setOpen] = useState(0);
  return (
    <div style={{ padding: "12px 14px 90px", overflowY: "auto", height: "100%" }}>
      {GRAMMAR.map((g, i) => (
        <div key={i} style={{ background: "#fff", border: "1px solid #EEEDE8", borderRadius: 10, marginBottom: 5, overflow: "hidden" }}>
          <button onClick={() => setOpen(open === i ? -1 : i)} style={{
            width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
            padding: "10px 16px", border: "none", background: "none", textAlign: "left",
          }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#17181A" }}>{g.title}</span>
            <ChevronDown size={17} color="#9A9DA3" style={{ transform: open === i ? "rotate(180deg)" : "none", transition: "transform .15s", flexShrink: 0, marginLeft: 8 }} />
          </button>
          {open === i && (
            <div style={{ padding: "0 16px 14px", fontSize: 13, color: "#4B4D52", lineHeight: 1.55, whiteSpace: "pre-line" }}>
              {g.body}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */
function App() {
  const [tab, setTab] = useState("vocab");
  const [known, setKnown] = useState(new Set());
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    loadKnown().then(ids => { setKnown(new Set(ids)); setLoaded(true); });
  }, []);

  const toggleKnown = useCallback((id) => {
    setKnown(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      saveKnown([...next]);
      return next;
    });
  }, []);

  const tabs = [
    { id: "vocab", label: "Wörter", icon: BookOpen },
    { id: "verbs", label: "Verben", icon: Repeat },
    { id: "texts", label: "Texte", icon: FileText },
    { id: "grammar", label: "Grammatik", icon: GraduationCap },
  ];

  return (
    <div style={{
      fontFamily: "-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif",
      background: "#F7F6F2", height: "100vh", maxWidth: 480, margin: "0 auto",
      display: "flex", flexDirection: "column", position: "relative", overflow: "hidden",
    }}>
      {/* Header — Swiss timetable-board style, white ground / hairline rule / red as accent only */}
      <div style={{ background: "#FFFFFF", borderBottom: "2px solid #17181A", padding: "16px 16px 14px", flexShrink: 0 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 10.5, letterSpacing: 2, color: "#E30613", fontWeight: 800, textTransform: "uppercase" }}>Zürich → B1</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#17181A", letterSpacing: -0.3 }}>Deutsch lernen</div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Flap value={known.size} label="Gelernt" />
            <Flap value={VOCAB.length} label="Gesamt" />
          </div>
        </div>
      </div>

      {/* Body */}
      <div style={{ flex: 1, overflow: "hidden" }}>
        {!loaded ? (
          <div style={{ padding: 40, textAlign: "center", color: "#9A9DA3", fontSize: 13.5 }}>Lädt…</div>
        ) : (
          <>
            {tab === "vocab" && <VocabTab known={known} toggleKnown={toggleKnown} />}
            {tab === "verbs" && <VerbsTab />}
            {tab === "texts" && <TextsTab />}
            {tab === "grammar" && <GrammarTab />}
          </>
        )}
      </div>

      {/* Bottom nav */}
      <div style={{
        position: "absolute", bottom: 0, left: 0, right: 0, background: "#fff",
        borderTop: "1px solid #EEEDE8", display: "flex", padding: "8px 6px calc(env(safe-area-inset-bottom, 8px))",
      }}>
        {tabs.map(t => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
              border: "none", background: "none", padding: "6px 0", color: active ? "#E30613" : "#9A9DA3",
            }}>
              <Icon size={20} strokeWidth={active ? 2.4 : 1.9} />
              <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
